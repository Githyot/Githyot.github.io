<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Voltando ao Araradental</title><link rel="stylesheet" href="../estilo.css"></head><body><main>
<header><img src="../icone.png" alt=""><strong>Araradental</strong></header>
<h1 id="t">Voltando ao Araradental…</h1>
<p id="m" class="meta">O login da Meta terminou. Esta página só devolve a resposta para o Araradental que está rodando no computador da clínica.</p>
<script>
// Página de retorno do "Entrar com a Meta". A Meta só aceita endereço de retorno com domínio público e HTTPS;
// o Araradental roda em http://localhost (ou no IP da rede da clínica). Esta página não guarda nem envia nada
// para lugar nenhum: só repassa o código (?code=…&state=…) para o /meta/callback do Araradental.
// O endereço de volta vem dentro do "state" (assinado pelo próprio Araradental) e só pode ser da rede local.
(function () {
  var q = new URLSearchParams(location.search);
  var back = 'http://localhost:3000';
  try {
    var p = String(q.get('state') || '').split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
    var d = JSON.parse(atob(p + '==='.slice((p.length + 3) % 4)));
    if (d && d.r) {
      var u = new URL(d.r);
      var h = u.hostname;
      var local = h === 'localhost' || /^127\./.test(h) || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h) || /\.local$/.test(h) || h === '[::1]';
      if (local && (u.protocol === 'http:' || u.protocol === 'https:')) back = u.origin;
    }
  } catch (e) { /* usa o padrão */ }
  var dest = back + '/meta/callback' + location.search;
  document.getElementById('m').innerHTML = 'Se nada acontecer em alguns segundos, <a id="a">clique aqui</a>. O Araradental precisa estar aberto neste computador.';
  document.getElementById('a').href = dest;
  location.replace(dest);
})();
</script>
</main></body></html>
